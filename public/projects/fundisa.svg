<svg width="1200" height="750" viewBox="0 0 1200 750" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">FUNDISA project placeholder</title>
  <desc id="desc">A neutral placeholder image for the FUNDISA project. Project details have not yet been supplied.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="750" gradientUnits="userSpaceOnUse">
      <stop stop-color="#070D18"/>
      <stop offset="1" stop-color="#0D1728"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" stroke="#1E293B" stroke-width="1"/>
    </pattern>
    <linearGradient id="accent" x1="420" y1="250" x2="780" y2="520" gradientUnits="userSpaceOnUse">
      <stop stop-color="#22D3EE"/>
      <stop offset="1" stop-color="#3B82F6"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="750" fill="url(#bg)"/>
  <rect width="1200" height="750" fill="url(#grid)" opacity="0.3"/>
  <circle cx="600" cy="360" r="280" fill="#0891B2" opacity="0.05"/>

  <rect x="250" y="150" width="700" height="450" rx="22" stroke="#233149" stroke-width="1.5" fill="#0B1322"/>
  <rect x="290" y="190" width="620" height="370" rx="16" stroke="#24324A" stroke-width="1.5" stroke-dasharray="10 9" fill="#0A1220"/>

  <rect x="566" y="238" width="68" height="68" rx="16" fill="#0F1D33" stroke="#22D3EE" stroke-opacity="0.25"/>
  <path d="M580 272H620M600 252V292" stroke="url(#accent)" stroke-width="2" stroke-linecap="round"/>

  <text x="600" y="360" text-anchor="middle" fill="#F8FAFC" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="52" font-weight="600" letter-spacing="10">FUNDISA</text>
  <text x="600" y="394" text-anchor="middle" fill="#64748B" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" letter-spacing="3">PROJECT DETAILS TO BE ADDED</text>

  <rect x="430" y="436" width="340" height="1" fill="#1E293B"/>
  <text x="600" y="472" text-anchor="middle" fill="#475569" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13">Add a project screenshot to public/projects/</text>
  <text x="600" y="496" text-anchor="middle" fill="#475569" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13">and update the image field in src/data/projects.ts</text>

  <rect x="520" y="522" width="160" height="6" rx="3" fill="#1E293B"/>
  <rect x="556" y="522" width="88" height="6" rx="3" fill="#22D3EE" opacity="0.35"/>

  <text x="250" y="654" fill="#475569" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" letter-spacing="2">PLACEHOLDER — NO PROJECT DETAILS INVENTED</text>
</svg>
